name: IndexNow

# Vercel reports each deployment back to GitHub (environment "Production",
# sometimes followed by the project name). Once a production deploy
# succeeds, ping IndexNow with the pages whose sitemap lastmod is recent.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap, not just recent changes
        type: boolean
        default: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
